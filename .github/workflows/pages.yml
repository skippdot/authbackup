# authbackup.com: site/ + PRIVACY.md -> _site/ (scripts/site.mjs) -> GitHub Pages.
name: Site
on:
  push:
    branches: [main]
    paths: ['site/**', 'PRIVACY.md', 'scripts/site.mjs', 'docs/store-assets/**', 'extension/icons/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
