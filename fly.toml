# Fly.io: the test bench. `fly launch --copy-config --no-deploy` then `fly deploy` (see DEPLOY.md).
# Remove `app` to let Fly generate a name.
primary_region = "ams"

[build]
  dockerfile = "bench/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
