# Tooling config only (this repo is not a Python package). The Python code is the verification bench in bench/.
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4"]

[tool.bandit]
exclude_dirs = ["node_modules", "_site", "dist", "tests", "site"]
